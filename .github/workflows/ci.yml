name: NeuralLab CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate curriculum
        run: npm run check:curriculum
      - name: Unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        run: npm run test:e2e

